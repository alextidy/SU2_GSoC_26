%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%
% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= INC_RANS
KIND_TURB_MODEL= SST
SST_OPTIONS= V2003m
RESTART_SOL= NO
%
% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION -------------------%
%
INC_DENSITY_MODEL= CONSTANT
INC_DENSITY_INIT= 1.225
%
INC_VELOCITY_INIT= (10.0, 0.0, 0.0)
%
INC_ENERGY_EQUATION= NO
INC_TEMPERATURE_INIT= 293.0
%
INC_NONDIM= DIMENSIONAL
%
% -------------------- FLUID PROPERTIES ------------------------------------- %
%
FLUID_MODEL= CONSTANT_DENSITY
%
% --------------------------- VISCOSITY MODEL ---------------------------------%
%
VISCOSITY_MODEL= CONSTANT_VISCOSITY
%
MU_CONSTANT= 1.82E-05
%
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_HEATFLUX= (pipe_wall, 0.0) % functions as no-slip wall
AXISYMMETRIC= YES
MARKER_SYM= (symmetry)
MARKER_EULER= (top_wall)
MARKER_FAR= (top_wall)
MARKER_INLET_TURBULENT= (jet_inlet, 0.04, 5, coflow_inlet, 0.004, 1)
%
INC_INLET_TYPE= VELOCITY_INLET VELOCITY_INLET
MARKER_INLET= (jet_inlet, 293.0, 50.0, 1.0, 0.0 0.0, coflow_inlet, 293.0, 10.0, 1.0, 0.0, 0.0 )
%
INC_OUTLET_TYPE= PRESSURE_OUTLET
MARKER_OUTLET= (outlet, 0.0)
%
% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
%
CFL_NUMBER= 0.5
CFL_ADAPT= YES
CFL_REDUCTION_TURB= 0.5
%
ITER= 20000
%
% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-5
LINEAR_SOLVER_ITER= 10
%
% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= NO
TIME_DISCRE_FLOW= EULER_IMPLICIT
SLOPE_LIMITER_FLOW= NONE
%VENKAT_LIMITER_COEFF= 0.05
%
% -------------------- TURBULENT NUMERICAL METHOD DEFINITION ------------------%
%
%CONV_NUM_METHOD_TURB= SCALAR_UPWIND
%MUSCL_TURB= NO
%
% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_FIELD= RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y, RMS_TKE
CONV_RESIDUAL_MINVAL= -10.0
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6
%
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= jet_pipe.su2
MESH_FORMAT= SU2
%
SCREEN_OUTPUT = (INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y, RMS_TKE)
SCREEN_WRT_FREQ_INNER= 10
%
HISTORY_OUTPUT= (ITER, RMS_RES, RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y)
%
OUTPUT_FILES= (RESTART, PARAVIEW_ASCII)